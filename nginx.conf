server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        image/svg+xml svg;
        image/png png;
        text/plain txt;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
